name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      NEXT_PUBLIC_DEXIE_CLOUD_DB_URL: https://zft3czbta.dexie.cloud
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci --strict-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
      - run: npm audit --omit=dev
      - name: Verify ordinary-install reproducibility
        run: |
          sha256sum package.json package-lock.json > /tmp/manifests.sha256
          npm install --strict-peer-deps
          sha256sum --check /tmp/manifests.sha256
          git diff --exit-code
